<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abdoul Malick Oumarou Allassane</title>
<meta name="description" content="Portfolio — informatique et sciences de l'image, Université de Sherbrooke. Vision par ordinateur, développement logiciel, systèmes embarqués.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* ============================================================
   Tokens — dark-first. Palette derived from the CIELAB a*b* axis:
   accent = +a* (magenta), signal = -a* (green), gold = +b* (yellow).
   ============================================================ */
:root{
  --ground:#0A0C10;
  --surface:#12161E;
  --surface-2:#171D27;
  --line:#232A37;
  --line-soft:#1B212C;
  --ink:#ECEFF4;
  --ink-dim:#A2ACBA;
  --ink-faint:#6C7687;
  --accent:#E8457F;
  --accent-soft:#FF89B0;
  --accent-wash:rgba(232,69,127,.12);
  --green:#35B894;
  --gold:#D9A441;
  --focus:#7FB2FF;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 18px 40px -28px rgba(0,0,0,.9);

  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Spectral',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --s--1:.8rem;
  --s-0:1.0rem;
  --s-1:1.2rem;
  --s-2:1.55rem;
  --s-3:2.1rem;
  --s-4:clamp(2.5rem,7vw,4.4rem);

  --rail:208px;
  --maxw:1200px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#F6F7F9;
    --surface:#FFFFFF;
    --surface-2:#F0F2F6;
    --line:#DDE2EA;
    --line-soft:#E8ECF2;
    --ink:#0F141C;
    --ink-dim:#4C5666;
    --ink-faint:#7B8697;
    --accent:#C22B67;
    --accent-soft:#8E1C49;
    --accent-wash:rgba(194,43,103,.09);
    --green:#1B8A6B;
    --gold:#8F6612;
    --focus:#1F5FD0;
    --shadow:0 1px 0 rgba(255,255,255,.6), 0 14px 34px -26px rgba(16,24,40,.55);
  }
}
:root[data-theme="light"]{
  --ground:#F6F7F9;
  --surface:#FFFFFF;
  --surface-2:#F0F2F6;
  --line:#DDE2EA;
  --line-soft:#E8ECF2;
  --ink:#0F141C;
  --ink-dim:#4C5666;
  --ink-faint:#7B8697;
  --accent:#C22B67;
  --accent-soft:#8E1C49;
  --accent-wash:rgba(194,43,103,.09);
  --green:#1B8A6B;
  --gold:#8F6612;
  --focus:#1F5FD0;
  --shadow:0 1px 0 rgba(255,255,255,.6), 0 14px 34px -26px rgba(16,24,40,.55);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-size:var(--s-0);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
img{max-width:100%;display:block}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.topbar-in{
  max-width:var(--maxw);margin:0 auto;
  padding:10px 24px;
  display:flex;align-items:center;gap:16px;
}
.brand{
  font-family:var(--mono);font-size:var(--s--1);letter-spacing:.06em;
  color:var(--ink);text-decoration:none;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.brand b{font-weight:500;color:var(--accent)}
.topbar-sp{flex:1}
.switch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.switch button{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;
  background:transparent;border:0;color:var(--ink-faint);
  padding:5px 11px;cursor:pointer;transition:color .15s,background .15s;
}
.switch button[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent)}
.switch button:hover{color:var(--ink)}

/* ---------- shell ---------- */
.shell{
  max-width:var(--maxw);margin:0 auto;
  padding-inline:24px;padding-block:0 88px;
  display:grid;grid-template-columns:1fr;gap:0;
}
@media (min-width:1020px){
  .shell{grid-template-columns:var(--rail) minmax(0,1fr);column-gap:64px}
}
.rail{display:none}
@media (min-width:1020px){
  .rail{
    display:block;position:sticky;top:96px;align-self:start;
    padding-top:56px;
  }
  .rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .rail a{
    display:block;text-decoration:none;
    font-family:var(--mono);font-size:.74rem;letter-spacing:.05em;
    color:var(--ink-faint);padding:5px 0 5px 14px;
    border-left:1px solid var(--line);transition:color .15s,border-color .15s;
  }
  .rail a:hover{color:var(--ink)}
  .rail a[aria-current="true"]{color:var(--accent);border-left-color:var(--accent)}
  .rail .rail-cta{
    margin-top:22px;padding-left:14px;font-family:var(--mono);
    font-size:.7rem;color:var(--ink-faint);line-height:1.7;
  }
}
main{min-width:0}

/* ---------- section furniture ---------- */
section{padding-block:64px 8px;scroll-margin-top:76px}
.eyebrow{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);
  display:flex;align-items:center;gap:12px;margin:0 0 18px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0}
h2{font-size:var(--s-3);font-weight:600;letter-spacing:-.02em;line-height:1.12}
h3{font-size:var(--s-1);font-weight:600;letter-spacing:-.01em}
p{margin:0 0 1em;max-width:66ch}
.lede{font-size:var(--s-1);color:var(--ink-dim);line-height:1.6}
.mono{font-family:var(--mono)}
.sec-intro{margin-bottom:26px}

/* ---------- hero ---------- */
.hero{padding-top:56px;padding-bottom:12px}
.hero-grid{display:grid;grid-template-columns:1fr;gap:36px;align-items:start}
@media (min-width:820px){
  .hero-grid{grid-template-columns:minmax(0,1fr) 320px;gap:48px}
}
.hero h1{
  font-size:var(--s-4);font-weight:700;line-height:.98;letter-spacing:-.035em;
  margin:0 0 20px;
}
.hero h1 .given{display:block;color:var(--ink)}
.hero h1 .family{display:block;color:var(--ink-faint);font-weight:400}
.status{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:.74rem;letter-spacing:.05em;
  color:var(--green);border:1px solid color-mix(in srgb,var(--green) 40%, transparent);
  background:color-mix(in srgb,var(--green) 10%, transparent);
  padding:4px 12px;border-radius:999px;margin-bottom:22px;
}
.status i{width:6px;height:6px;border-radius:50%;background:var(--green);display:block}
.hero-lede{font-size:clamp(1.05rem,2.2vw,1.28rem);line-height:1.55;color:var(--ink-dim);max-width:34ch}
.hero-lede strong{color:var(--ink);font-weight:600}
.facts{
  margin:30px 0 0;display:grid;grid-template-columns:1fr;gap:0;
  border-top:1px solid var(--line);
}
@media (min-width:560px){.facts{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}}
.fact{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:var(--s--1)}
.fact dt{font-family:var(--mono);color:var(--ink-faint);letter-spacing:.04em;min-width:92px;flex:none}
.fact dd{margin:0;color:var(--ink-dim)}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{
  font-family:var(--display);font-size:.9rem;font-weight:600;
  text-decoration:none;padding:9px 18px;border-radius:4px;
  border:1px solid var(--line);color:var(--ink);background:var(--surface);
  transition:border-color .15s,color .15s,background .15s;
}
.btn:hover{border-color:var(--ink-faint)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-soft);border-color:var(--accent-soft);color:#0A0C10}
:root[data-theme="light"] .btn-primary:hover,
:root:not([data-theme="dark"]) .btn-primary:hover{color:#fff}

/* ---------- lab figure ---------- */
.figure{
  border:1px solid var(--line);background:var(--surface);
  border-radius:6px;padding:16px;box-shadow:var(--shadow);
}
.figure-plot{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--surface-2);border-radius:3px;overflow:hidden}
.figure-plot canvas{width:100%;height:100%;display:block;image-rendering:auto}
.figure-plot canvas{cursor:ew-resize;touch-action:none}
.axis{
  position:absolute;bottom:8px;font-family:var(--mono);font-size:.6rem;
  letter-spacing:.12em;text-transform:uppercase;pointer-events:none;
  background:rgba(8,10,14,.65);color:#E9ECF1;padding:2px 7px;border-radius:2px;
}
.axis.w{left:8px}
.axis.e{right:8px;color:#FF9DBE}
.kernel-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:12px}
.op-group{
  font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);width:100%;margin:8px 0 1px;
}
.op-group:first-child{margin-top:0}
.kernel-row button{
  font-family:var(--mono);font-size:.67rem;letter-spacing:.03em;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-dim);
  padding:4px 9px;border-radius:3px;cursor:pointer;transition:all .15s;
}
.kernel-row button:hover{color:var(--ink);border-color:var(--ink-faint)}
.kernel-row button[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);color:var(--accent)}
.kernel-info{margin-top:12px}
.kernel-time{font-family:var(--mono);font-size:.62rem;color:var(--green);margin:6px 0 0}
.kernel-matrix{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);border-radius:3px;
  max-width:186px;overflow:hidden;
}
.kernel-matrix span{
  background:var(--surface-2);font-family:var(--mono);font-size:.68rem;
  text-align:center;padding:5px 2px;color:var(--ink-dim);font-variant-numeric:tabular-nums;
}
.kernel-matrix span.c{color:var(--accent)}
.kernel-note{font-family:var(--mono);font-size:.63rem;line-height:1.65;color:var(--ink-faint);margin:8px 0 0}
.slider-row{display:flex;align-items:center;gap:12px;margin-top:14px}
.slider-row label{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);white-space:nowrap}
.slider-row output{font-family:var(--mono);font-size:.72rem;color:var(--accent);font-variant-numeric:tabular-nums;min-width:2.6em;text-align:right}
input[type=range]{flex:1;accent-color:var(--accent);height:20px;min-width:0}
.figure figcaption{
  font-family:var(--mono);font-size:.68rem;line-height:1.6;color:var(--ink-faint);
  margin-top:12px;border-top:1px solid var(--line-soft);padding-top:10px;
}

/* ---------- prose + pull ---------- */
.two-col{display:grid;grid-template-columns:1fr;gap:34px}
@media (min-width:760px){.two-col{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:48px}}
.aside-note{
  font-family:var(--mono);font-size:.76rem;line-height:1.75;color:var(--ink-dim);
  border-left:2px solid var(--accent);padding-left:16px;
}
.aside-note b{color:var(--ink);font-weight:500;display:block;margin-bottom:6px}

/* ---------- skills ---------- */
.skill-groups{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
@media (min-width:700px){.skill-groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
.skill-group{background:var(--surface);padding:20px 22px}
.skill-group h3{font-size:.98rem;margin-bottom:4px}
.skill-group .who{font-family:var(--mono);font-size:.68rem;color:var(--ink-faint);letter-spacing:.05em;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{
  font-family:var(--mono);font-size:.71rem;letter-spacing:.02em;
  padding:3px 9px;border:1px solid var(--line);border-radius:3px;
  color:var(--ink-dim);background:var(--surface-2);
}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:1px;background:var(--line)}
.tl > li{position:relative;padding:0 0 30px 34px}
.tl-dot{position:absolute;left:0;top:7px;width:15px;height:15px;border-radius:50%;background:var(--ground);border:1px solid var(--line);display:grid;place-items:center}
.tl-dot::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-faint)}
.tl > li.is-now .tl-dot{border-color:var(--accent)}
.tl > li.is-now .tl-dot::after{background:var(--accent)}
.tl-period{font-family:var(--mono);font-size:.71rem;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.tl h3{margin:3px 0 2px}
.tl .org{font-size:.88rem;color:var(--accent);margin-bottom:8px;font-family:var(--display);font-weight:500}
.tl ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:.93rem}
.tl ul li{margin-bottom:4px}
.quote{
  margin:14px 0 0;padding:14px 16px;background:var(--surface);
  border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:0 4px 4px 0;
}
.quote p{font-style:italic;color:var(--ink-dim);font-size:.93rem;margin:0 0 8px}
.quote cite{font-family:var(--mono);font-style:normal;font-size:.7rem;color:var(--ink-faint);letter-spacing:.04em}

/* ---------- témoignages ---------- */
.quote-grid{display:grid;grid-template-columns:1fr;gap:26px}
@media (min-width:780px){.quote-grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px}}
.testi{display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:1px solid var(--line)}
.testi.feature{grid-column:1/-1;border-top:2px solid var(--gold)}
.testi blockquote{margin:0;font-size:1.02rem;line-height:1.6;color:var(--ink);max-width:62ch}
.testi.feature blockquote{font-size:clamp(1.12rem,2.4vw,1.42rem);line-height:1.5}
.testi blockquote::before{content:"«";color:var(--gold);margin-right:.28em;font-size:1.15em;line-height:0}
.testi blockquote::after{content:"»";color:var(--gold);margin-left:.2em;font-size:1.15em;line-height:0}
.testi .who{font-family:var(--display);font-size:.9rem;font-weight:600;color:var(--ink)}
.testi .src{font-family:var(--mono);font-size:.68rem;color:var(--ink-faint);letter-spacing:.04em;line-height:1.6;display:block;margin-top:2px}
.testi .src em{font-style:normal;color:var(--gold)}

/* ---------- projects ---------- */
.proj-grid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:760px){.proj-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;align-items:start}}
.proj{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:22px;display:flex;flex-direction:column;gap:10px;
  transition:border-color .18s,transform .18s;
}
.proj:hover{border-color:var(--ink-faint)}
.proj.is-lead{border-left:2px solid var(--accent)}
.proj-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.proj-kind{font-family:var(--mono);font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.proj-when{font-family:var(--mono);font-size:.67rem;color:var(--ink-faint);white-space:nowrap}
.proj h3{font-size:1.06rem;line-height:1.25}
.proj-role{font-family:var(--mono);font-size:.71rem;color:var(--accent);letter-spacing:.03em}
.proj p{font-size:.93rem;color:var(--ink-dim);margin:0}
.proj ul.bul{margin:0;padding-left:17px;font-size:.88rem;color:var(--ink-dim)}
.proj ul.bul li{margin-bottom:3px}
.proj .chips{margin-top:6px;padding-top:6px}
.shots{display:grid;gap:8px;margin:4px 0 2px}
.shots a{display:block;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface-2);transition:border-color .15s}
.shots a:hover{border-color:var(--accent)}
.shots img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:center top;display:block}
.shots img.pos-center{object-position:center}
.shots figcaption{font-family:var(--mono);font-size:.63rem;color:var(--ink-faint);padding:5px 7px;line-height:1.4;border-top:1px solid var(--line-soft)}
.proj.is-wide{grid-column:1/-1}
.reel-note{font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;color:var(--ink-faint);margin:6px 0 0}
.reel{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:8px 0 2px}
.reel figure{margin:0}
.reel video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;border:1px solid var(--line);border-radius:4px;display:block}
.reel figcaption{font-family:var(--mono);font-size:.63rem;color:var(--ink-faint);margin-top:5px;line-height:1.4}

/* ---------- courses ---------- */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.filters button{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-dim);
  padding:5px 12px;border-radius:3px;cursor:pointer;transition:all .15s;
}
.filters button:hover{color:var(--ink);border-color:var(--ink-faint)}
.filters button[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);color:var(--accent)}
.course-grid{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
@media (min-width:640px){.course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1020px){.course-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.course{background:var(--surface);padding:15px 17px;display:flex;flex-direction:column;gap:7px}
.course-head{display:flex;align-items:center;gap:8px}
.course-code{font-family:var(--mono);font-size:.78rem;font-weight:500;color:var(--accent);letter-spacing:.03em}
.course-badge{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;
  padding:1px 6px;border-radius:2px;border:1px solid var(--line);color:var(--ink-faint);
}
.course-badge.now{border-color:color-mix(in srgb,var(--green) 45%,transparent);color:var(--green)}
.course-title{font-family:var(--display);font-size:.9rem;font-weight:500;line-height:1.3}
.course-skills{font-size:.8rem;color:var(--ink-dim);line-height:1.55;margin:0}
.course.hide{display:none}
.course-count{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);margin-top:12px}

/* ---------- education / awards ---------- */
.edu{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
.edu li{background:var(--surface);padding:16px 18px;display:grid;grid-template-columns:1fr;gap:3px}
@media (min-width:640px){.edu li{grid-template-columns:130px minmax(0,1fr);gap:18px;align-items:baseline}}
.edu .when{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);letter-spacing:.04em}
.edu .what{font-family:var(--display);font-weight:500;font-size:.96rem}
.edu .where{font-size:.86rem;color:var(--ink-dim);display:block}
.awards{display:grid;grid-template-columns:1fr;gap:12px;margin-top:22px}
@media (min-width:700px){.awards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.award{border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:0 0 5px 5px;background:var(--surface);padding:16px 17px}
.award h3{font-size:.92rem;margin-bottom:5px}
.award p{font-size:.83rem;color:var(--ink-dim);margin:0}
.award .yr{font-family:var(--mono);font-size:.68rem;color:var(--gold);letter-spacing:.06em;display:block;margin-bottom:7px}

/* ---------- contact ---------- */
.contact-wrap{

const NAV_IDS = [
  ["apropos","nav.about"],["competences","nav.skills"],["experience","nav.experience"],
  ["temoignages","nav.quotes"],["projets","nav.projects"],["cours","nav.courses"],
  ["formation","nav.education"],["contact","nav.contact"]
];

let lang = "fr";
let filter = "all";
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const t = k => T[lang][k];
const el = (tag,cls,html)=>{const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n;};

function renderAll(){
  document.documentElement.lang = lang;

  $$("[data-i18n]").forEach(n=>{ n.textContent = t(n.dataset.i18n) ?? ""; });
  $$("[data-i18n-html]").forEach(n=>{ n.innerHTML = t(n.dataset.i18nHtml) ?? ""; });

  // rail
  const rail = $("#rail-list"); rail.innerHTML="";
  NAV_IDS.forEach(([id,key])=>{
    const li = el("li"); const a = el("a",null,t(key)); a.href="#"+id; a.dataset.target=id; li.append(a); rail.append(li);
  });
  $("#rail-cta").textContent = t("railCta");

  // facts
  const facts = $("#facts"); facts.innerHTML="";
  FACTS.forEach(f=>{
    const d = el("div","fact");
    d.append(el("dt",null,f[lang][0]), el("dd",null,f[lang][1]));
    facts.append(d);
  });

  // about
  const ab = $("#about-body"); ab.innerHTML="";
  ABOUT[lang].forEach(p=>ab.append(el("p",null,p)));

  // skills
  const sg = $("#skill-groups"); sg.innerHTML="";
  SKILLS.forEach(g=>{
    const d = el("div","skill-group");
    d.append(el("h3",null,g[lang].h), el("p","who",g[lang].who));
    const ul = el("ul","chips");
    g.chips.forEach(c=>ul.append(el("li",null,c)));
    d.append(ul); sg.append(d);
  });

  // timeline
  const tl = $("#timeline"); tl.innerHTML="";
  TIMELINE.forEach(item=>{
    const o = item[lang];
    const li = el("li", item.now ? "is-now" : null);
    li.append(el("span","tl-dot"));
    li.append(el("p","tl-period",o.p));
    li.append(el("h3",null,o.r));
    li.append(el("p","org",o.o));
    const ul = el("ul"); o.b.forEach(b=>ul.append(el("li",null,b))); li.append(ul);
    if(o.q){
      const q = el("blockquote","quote");
      q.append(el("p",null,"« "+o.q+" »"), el("cite",null,o.qb));
      li.append(q);
    }
    tl.append(li);
  });

  // testimonials
  const qg = $("#quote-grid"); qg.innerHTML="";
  TESTIMONIALS.forEach(t2=>{
    const d = el("article","testi"+(t2.feature?" feature":""));
    d.append(el("blockquote",null,t2[lang]));
    const w = el("div");
    w.append(el("span","who",t2.who));
    const src = el("span","src");
    src.innerHTML = (lang==="fr"?t2.roleFr:t2.roleEn) + "<br><em>" + (lang==="fr"?t2.srcFr:t2.srcEn) + "</em>";
    w.append(src);
    d.append(w);
    qg.append(d);
  });

  // projects
  const pg = $("#proj-grid"); pg.innerHTML="";
  PROJECTS.forEach(p=>{
    const o = p[lang];
    const card = el("article", "proj"+(p.lead?" is-lead":"")+(p.wide?" is-wide":""));
    const top = el("div","proj-top");
    top.append(el("span","proj-kind",p.kind[lang]), el("span","proj-when",p.when));
    card.append(top, el("h3",null,o.t), el("p","proj-role",o.r), el("p",null,o.d));
    const ul = el("ul","bul"); o.b.forEach(b=>ul.append(el("li",null,b))); card.append(ul);
    if(p.reel){
      if(p.reelNote) card.append(el("p","reel-note",p.reelNote[lang]));
      const r = el("div","reel");
      p.reel.forEach(([src,poster,cap])=>{
        const fig = el("figure");
        const v = document.createElement("video");
        v.controls = true; v.loop = true; v.playsInline = true;
        v.preload = "none"; v.poster = poster;
        const s = document.createElement("source"); s.src = src; s.type = "video/mp4";
        v.append(s);
        fig.append(v, el("figcaption",null,cap));
        r.append(fig);
      });
      card.append(r);
    }
    if(p.shots){
      if(p.shotsNote) card.append(el("p","reel-note",p.shotsNote[lang]));
      const g = el("div","shots");
      g.style.gridTemplateColumns = "repeat("+Math.min(p.shots.length,6)+",minmax(0,1fr))";
      p.shots.forEach(([src,cap])=>{
        const a = el("a"); a.href = src; a.target="_blank"; a.rel="noopener";
        const fig = el("figure"); fig.style.margin="0";
        const im = el("img"); im.src = src; im.alt = cap; im.loading="lazy";
        if(p.shotsCenter) im.className = "pos-center";
        fig.append(im, el("figcaption",null,cap));
        a.append(fig); g.append(a);
      });
      card.append(g);
    }
    const ch = el("ul","chips"); p.chips.forEach(c=>ch.append(el("li",null,c))); card.append(ch);
    pg.append(card);
  });

  // course filters
  const cats = ["all","image","soft","data","math","game"];
  const cf = $("#course-filters"); cf.innerHTML="";
  cats.forEach(c=>{
    const b = el("button",null,t("cat."+c));
    b.type="button"; b.dataset.cat=c;
    b.setAttribute("aria-pressed", String(c===filter));
    b.addEventListener("click",()=>{ filter=c; renderCourses(); $$("#course-filters button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.cat===filter))); });
    cf.append(b);
  });
  renderCourses();

  // education
  const ed = $("#edu-list"); ed.innerHTML="";
  EDU.forEach(e=>{
    const li = el("li");
    li.append(el("span","when",e[lang][0]));
    const box = el("div");
    box.append(el("span","what",e[lang][1]), el("span","where",e[lang][2]));
    li.append(box); ed.append(li);
  });

  // awards
  const aw = $("#awards"); aw.innerHTML="";
  AWARDS.forEach(a=>{
    const d = el("div","award");
    d.append(el("span","yr",a.yr), el("h3",null,a[lang][0]), el("p",null,a[lang][1]));
    aw.append(d);
  });

  // contact
  const cl = $("#contact-list"); cl.innerHTML="";
  const cvHref = lang === "fr" ? SITE.cv : SITE.cvEn;
  const rows = [
    ["c.email", SITE.email, "mailto:"+SITE.email],
    ["c.school", SITE.emailSchool, "mailto:"+SITE.emailSchool],
    ["c.linkedin", "oumarou-allassane-abdoul-malick", SITE.linkedin],
    ["c.github", SITE.github.replace("https://",""), SITE.github],
    ["c.cv", cvHref.split("/").pop(), cvHref]
  ];
  rows.forEach(([k,v,href])=>{
    const li = el("li"); const a = el("a");
    a.href = href;
    if(href.startsWith("http")){ a.target="_blank"; a.rel="noopener"; }
    a.append(el("span","k",t(k)), el("span","v",v));
    li.append(a); cl.append(li);
  });
  $("#cv-link").href = cvHref;

  buildOpRow();
  applyOp(heroOp);

  $("#foot-left").textContent = t("foot.left");
  $("#foot-right").textContent = t("foot.right");
}

function renderCourses(){
  const grid = $("#course-grid"); grid.innerHTML="";
  let shown = 0;
  COURSES.forEach(c=>{
    const match = filter==="all" || c.cat===filter;
    if(!match) return;
    shown++;
    const d = el("div","course");
    const head = el("div","course-head");
    head.append(el("span","course-code",c.c));
    head.append(el("span","course-badge"+(c.st==="now"?" now":""), t("badge."+(c.st==="now"?"now":"done"))));
    d.append(head, el("p","course-title",c[lang][0]), el("p","course-skills",c[lang][1]));
    grid.append(d);
  });
  $("#course-count").textContent = T[lang]["courses.count"](shown, COURSES.length);
}

/* ---------- language & theme ---------- */
function setLang(l){
  lang = l;
  $("#lang-fr").setAttribute("aria-pressed", String(l==="fr"));
  $("#lang-en").setAttribute("aria-pressed", String(l==="en"));
  try{ localStorage.setItem("pf-lang", l); }catch(e){}
  renderAll();
  spy();
}
$("#lang-fr").addEventListener("click",()=>setLang("fr"));
$("#lang-en").addEventListener("click",()=>setLang("en"));

function currentTheme(){
  const explicit = document.documentElement.getAttribute("data-theme");
  if(explicit) return explicit;
  return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}
function setTheme(th){
  document.documentElement.setAttribute("data-theme", th);
  $("#theme-label").textContent = th === "dark" ? "DARK" : "LIGHT";
  $("#theme-toggle").setAttribute("aria-pressed", String(th==="light"));
  try{ localStorage.setItem("pf-theme", th); }catch(e){}
}
$("#theme-toggle").addEventListener("click",()=>setTheme(currentTheme()==="dark"?"light":"dark"));

  freq:     { fr:"Fréquence",    en:"Frequency" },
  vision:   { fr:"Vision",       en:"Vision" }
};

const canvas = $("#conv-canvas");
const ctx = canvas.getContext("2d", { willReadFrequently:true });
const W = canvas.width, H = canvas.height;

let heroOriginal = null, heroFiltered = null, heroOp = "gradient", heroReady = false;
let heroLum = null;                 // luminance de la source
const heroCache = Object.create(null);

/* ---------- primitives ---------- */
const clampi = (v, max) => v < 0 ? 0 : (v > max ? max : v);
const clamp255 = v => v < 0 ? 0 : (v > 255 ? 255 : v);

function luminance(src){
  const s = src.data, out = new Float32Array(W*H);
  for(let i = 0, p = 0; i < s.length; i += 4, p++)
    out[p] = 0.2126*s[i] + 0.7152*s[i+1] + 0.0722*s[i+2];
  return out;
}
function grayToImage(lum){
  const img = ctx.createImageData(W, H), d = img.data;
  for(let p = 0, o = 0; p < lum.length; p++, o += 4){
    const v = clamp255(lum[p]);
    d[o] = d[o+1] = d[o+2] = v; d[o+3] = 255;
  }
  return img;
}
// convolution 3x3 sur un plan de luminance
function conv3(lum, k, div = 1, bias = 0){
  const out = new Float32Array(W*H);
  for(let y = 0; y < H; y++){
    for(let x = 0; x < W; x++){
      let acc = 0;
      for(let j = -1; j <= 1; j++){
        const yy = clampi(y + j, H - 1) * W;
        for(let i = -1; i <= 1; i++){
          acc += lum[yy + clampi(x + i, W - 1)] * k[(j+1)*3 + (i+1)];
        }
      }
      out[y*W + x] = acc/div + bias;
    }
  }
  return out;
}
// convolution 3x3 sur les trois canaux (préserve la couleur)
function conv3Color(src, k, div = 1){
  const s = src.data, img = ctx.createImageData(W, H), d = img.data;
  for(let y = 0; y < H; y++){
    for(let x = 0; x < W; x++){
      const o = (y*W + x)*4;
      for(let c = 0; c < 3; c++){
        let acc = 0;
        for(let j = -1; j <= 1; j++){
          const yy = clampi(y + j, H - 1);
          for(let i = -1; i <= 1; i++){
            acc += s[(yy*W + clampi(x + i, W - 1))*4 + c] * k[(j+1)*3 + (i+1)];
          }
        }
        d[o+c] = clamp255(acc/div);
      }
      d[o+3] = 255;
    }
  }
  return img;
}
const GAUSS3 = [1,2,1, 2,4,2, 1,2,1];
const SOBEL_X = [-1,0,1, -2,0,2, -1,0,1];
const SOBEL_Y = [-1,-2,-1, 0,0,0, 1,2,1];

/* ---------- opérations ---------- */
function opMedian(src){
  const s = src.data, img = ctx.createImageData(W, H), d = img.data;
  const win = new Uint8Array(9);
  for(let y = 0; y < H; y++){
    for(let x = 0; x < W; x++){
      const o = (y*W + x)*4;
      for(let c = 0; c < 3; c++){
        let n = 0;
        for(let j = -1; j <= 1; j++){
          const yy = clampi(y + j, H - 1);
          for(let i = -1; i <= 1; i++) win[n++] = s[(yy*W + clampi(x + i, W - 1))*4 + c];
        }
        // tri par insertion sur 9 éléments
        for(let a = 1; a < 9; a++){
          const v = win[a]; let b = a - 1;
          while(b >= 0 && win[b] > v){ win[b+1] = win[b]; b--; }
          win[b+1] = v;
        }
        d[o+c] = win[4];
      }
      d[o+3] = 255;
    }
  }
  return img;
}

function gradientMag(lum){
  const gx = conv3(lum, SOBEL_X), gy = conv3(lum, SOBEL_Y);
  const mag = new Float32Array(W*H);
  for(let p = 0; p < mag.length; p++) mag[p] = Math.hypot(gx[p], gy[p]);
  return { gx, gy, mag };
}

function otsuThreshold(lum){
  const hist = new Float64Array(256);
  for(let p = 0; p < lum.length; p++) hist[clamp255(lum[p]) | 0]++;
  const total = lum.length;
  let sum = 0;
  for(let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, thr = 127;
  for(let i = 0; i < 256; i++){
    wB += hist[i];
    if(!wB) continue;
    const wF = total - wB;
    if(!wF) break;
    sumB += i * hist[i];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if(between > best){ best = between; thr = i; }
  }
  return thr;
}
function binarize(lum, thr){
  const out = new Float32Array(W*H);
  for(let p = 0; p < lum.length; p++) out[p] = lum[p] > thr ? 255 : 0;
  return out;
}
function morph(bin, dilate){
  const out = new Float32Array(W*H);
  for(let y = 0; y < H; y++){
    for(let x = 0; x < W; x++){
      let v = dilate ? 0 : 255;
      for(let j = -1; j <= 1; j++){
        const yy = clampi(y + j, H - 1) * W;
        for(let i = -1; i <= 1; i++){
          const n = bin[yy + clampi(x + i, W - 1)];
          v = dilate ? Math.max(v, n) : Math.min(v, n);
        }
      }
      out[y*W + x] = v;
    }
  }
  return out;
}

function opCanny(lum){
  const sm = conv3(lum, GAUSS3, 16);
  const { gx, gy, mag } = gradientMag(sm);
  // suppression des non-maxima le long de la direction du gradient
  const thin = new Float32Array(W*H);
  for(let y = 1; y < H-1; y++){
    for(let x = 1; x < W-1; x++){
      const p = y*W + x;
      let a = (Math.atan2(gy[p], gx[p]) * 180 / Math.PI + 180) % 180;
      let n1, n2;
      if(a < 22.5 || a >= 157.5){ n1 = mag[p-1];     n2 = mag[p+1]; }
      else if(a < 67.5)         { n1 = mag[p-W+1];   n2 = mag[p+W-1]; }
      else if(a < 112.5)        { n1 = mag[p-W];     n2 = mag[p+W]; }
      else                      { n1 = mag[p-W-1];   n2 = mag[p+W+1]; }
      thin[p] = (mag[p] >= n1 && mag[p] >= n2) ? mag[p] : 0;
    }
  }
  // double seuil issu du 92e centile, puis hystérésis
  const sorted = Float32Array.from(thin).sort();
  const high = sorted[Math.floor(sorted.length * 0.92)] || 40;
  const low = high * 0.4;
  const out = new Float32Array(W*H);
  const stack = [];
  for(let p = 0; p < thin.length; p++) if(thin[p] >= high){ out[p] = 255; stack.push(p); }
  while(stack.length){
    const p = stack.pop(), y = (p / W) | 0, x = p % W;
    for(let j = -1; j <= 1; j++){
      for(let i = -1; i <= 1; i++){
        const q = clampi(y+j, H-1)*W + clampi(x+i, W-1);
        if(out[q] === 0 && thin[q] >= low){ out[q] = 255; stack.push(q); }
      }
    }
  }
  return out;
}

function opEqualize(src, lum){
  const hist = new Float64Array(256);
  for(let p = 0; p < lum.length; p++) hist[clamp255(lum[p]) | 0]++;
  const cdf = new Float64Array(256);
  let acc = 0;
  for(let i = 0; i < 256; i++){ acc += hist[i]; cdf[i] = acc; }
  const total = lum.length;
  const map = new Float32Array(256);
  for(let i = 0; i < 256; i++) map[i] = (cdf[i] / total) * 255;
  const s = src.data, img = ctx.createImageData(W, H), d = img.data;
  for(let p = 0, o = 0; p < lum.length; p++, o += 4){
    const l = clamp255(lum[p]);
    const ratio = l > 1 ? map[l | 0] / l : 1;
    d[o]   = clamp255(s[o]   * ratio);
    d[o+1] = clamp255(s[o+1] * ratio);
    d[o+2] = clamp255(s[o+2] * ratio);
    d[o+3] = 255;
  }
  return img;
}

function opQuantize(src, K = 6){
  const s = src.data, N = W*H;
  // initialisation régulière sur la diagonale des niveaux
  const cen = [];
  for(let i = 0; i < K; i++){ const v = (i + 0.5) * 255 / K; cen.push([v, v, v]); }
  const assign = new Uint8Array(N);
  const step = 7;                     // sous-échantillonnage pour l'ajustement
  for(let it = 0; it < 8; it++){
    const sums = Array.from({length:K}, () => [0,0,0,0]);
    for(let p = 0; p < N; p += step){
      const o = p*4;
      let best = 0, bd = Infinity;
      for(let c = 0; c < K; c++){
        const dr = s[o]-cen[c][0], dg = s[o+1]-cen[c][1], db = s[o+2]-cen[c][2];
        const dist = dr*dr + dg*dg + db*db;
        if(dist < bd){ bd = dist; best = c; }
      }
      const t = sums[best];
      t[0] += s[o]; t[1] += s[o+1]; t[2] += s[o+2]; t[3]++;
    }
    for(let c = 0; c < K; c++) if(sums[c][3])
      cen[c] = [sums[c][0]/sums[c][3], sums[c][1]/sums[c][3], sums[c][2]/sums[c][3]];
  }
  const img = ctx.createImageData(W, H), d = img.data;
  for(let p = 0; p < N; p++){
    const o = p*4;
    let best = 0, bd = Infinity;
    for(let c = 0; c < K; c++){
      const dr = s[o]-cen[c][0], dg = s[o+1]-cen[c][1], db = s[o+2]-cen[c][2];
      const dist = dr*dr + dg*dg + db*db;
      if(dist < bd){ bd = dist; best = c; }
    }
    assign[p] = best;
    d[o] = cen[best][0]; d[o+1] = cen[best][1]; d[o+2] = cen[best][2]; d[o+3] = 255;
  }
  return img;
}

/* FFT 1D en place (Cooley-Tukey radix 2) */
function fft1d(re, im, n, inverse){
  for(let i = 1, j = 0; i < n; i++){
    let bit = n >> 1;
    for(; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if(i < j){
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for(let len = 2; len <= n; len <<= 1){
    const ang = (inverse ? 2 : -2) * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for(let i = 0; i < n; i += len){
      let cr = 1, ci = 0;
      for(let k = 0; k < len/2; k++){
        const ur = re[i+k], ui = im[i+k];
        const vr = re[i+k+len/2]*cr - im[i+k+len/2]*ci;
        const vi = re[i+k+len/2]*ci + im[i+k+len/2]*cr;
        re[i+k] = ur + vr; im[i+k] = ui + vi;
        re[i+k+len/2] = ur - vr; im[i+k+len/2] = ui - vi;
        const ncr = cr*wr - ci*wi;
        ci = cr*wi + ci*wr; cr = ncr;
      }
    }
  }
}
function opSpectrum(lum){
  const re = new Float64Array(W*H), im = new Float64Array(W*H);
  // centrage du spectre : multiplication par (-1)^(x+y)
  for(let y = 0; y < H; y++)
    for(let x = 0; x < W; x++)
      re[y*W + x] = lum[y*W + x] * (((x + y) & 1) ? -1 : 1);
  const rowR = new Float64Array(W), rowI = new Float64Array(W);
  for(let y = 0; y < H; y++){
    for(let x = 0; x < W; x++){ rowR[x] = re[y*W+x]; rowI[x] = im[y*W+x]; }
    fft1d(rowR, rowI, W, false);
    for(let x = 0; x < W; x++){ re[y*W+x] = rowR[x]; im[y*W+x] = rowI[x]; }
  }
  const colR = new Float64Array(H), colI = new Float64Array(H);
  for(let x = 0; x < W; x++){
    for(let y = 0; y < H; y++){ colR[y] = re[y*W+x]; colI[y] = im[y*W+x]; }
    fft1d(colR, colI, H, false);
    for(let y = 0; y < H; y++){ re[y*W+x] = colR[y]; im[y*W+x] = colI[y]; }
  }
  const out = new Float32Array(W*H);
  let maxv = 0, minv = Infinity;
  for(let p = 0; p < out.length; p++){
    out[p] = Math.log(1 + Math.hypot(re[p], im[p]));
    if(out[p] > maxv) maxv = out[p];
    if(out[p] < minv) minv = out[p];
  }
  // etirement + gamma : sans cela le logarithme aplatit tout en gris moyen
  const span = (maxv - minv) || 1;
  for(let p = 0; p < out.length; p++)
    out[p] = 255 * Math.pow((out[p] - minv) / span, 2.4);
  return out;
}

function opHarris(src, lum){
  const gx = conv3(lum, SOBEL_X), gy = conv3(lum, SOBEL_Y);
  const xx = new Float32Array(W*H), yy = new Float32Array(W*H), xy = new Float32Array(W*H);
  for(let p = 0; p < gx.length; p++){
    xx[p] = gx[p]*gx[p]; yy[p] = gy[p]*gy[p]; xy[p] = gx[p]*gy[p];
  }
  const sxx = conv3(xx, GAUSS3, 16), syy = conv3(yy, GAUSS3, 16), sxy = conv3(xy, GAUSS3, 16);
  const R = new Float32Array(W*H);
  const kH = 0.05;
  for(let p = 0; p < R.length; p++){
    const det = sxx[p]*syy[p] - sxy[p]*sxy[p];
    const tr = sxx[p] + syy[p];
    R[p] = det - kH*tr*tr;
  }
  let maxR = 0;
  for(let p = 0; p < R.length; p++) if(R[p] > maxR) maxR = R[p];
  const thr = maxR * 0.01;
  // candidats, puis suppression des non-maxima a distance minimale
  const cands = [];
  for(let y = 6; y < H - 6; y++)
    for(let x = 6; x < W - 6; x++){
      const p = y*W + x;
      if(R[p] > thr) cands.push([R[p], x, y]);
    }
  cands.sort((a, b) => b[0] - a[0]);
  const pool = cands.slice(0, 6000);
  const MIN_D2 = 14 * 14, MAX_N = 180, kept = [];
  for(const c of pool){
    if(kept.length >= MAX_N) break;
    let ok = true;
    for(const k of kept){
      const dx = k[1] - c[1], dy = k[2] - c[2];
      if(dx*dx + dy*dy < MIN_D2){ ok = false; break; }
    }
    if(ok) kept.push(c);
  }
  // image de sortie : original + un carre ouvert sur chaque coin retenu
  const img = new ImageData(new Uint8ClampedArray(src.data), W, H);
  const d = img.data;
  const rad = 5;
  const mark = (x, y, r, cr, cg, cb) => {
    for(let j = -r; j <= r; j++){
      for(let i = -r; i <= r; i++){
        if(Math.abs(i) !== r && Math.abs(j) !== r) continue;
        const yy = y + j, xx = x + i;
        if(yy < 0 || yy >= H || xx < 0 || xx >= W) continue;
        const o = (yy*W + xx)*4;
        d[o] = cr; d[o+1] = cg; d[o+2] = cb; d[o+3] = 255;
      }
    }
  };
  for(const c of kept){
    mark(c[1], c[2], rad + 1, 10, 10, 14);
    mark(c[1], c[2], rad, 255, 70, 130);
  }
  return img;
}

/* ---------- catalogue ---------- */
const OPS = [
  { id:"identite", g:"filtrage", fr:"Identité", en:"Identity", k:[0,0,0, 0,1,0, 0,0,0],
    run:(src) => new ImageData(new Uint8ClampedArray(src.data), W, H) },

  { id:"flou", g:"filtrage", fr:"Flou gaussien", en:"Gaussian blur", k:GAUSS3, div:16,
    run:(src) => conv3Color(src, GAUSS3, 16) },

  { id:"median", g:"filtrage", fr:"Filtre médian", en:"Median filter",
    note:{ fr:"Valeur médiane d'un voisinage 3 × 3, par canal. Non linéaire : retire le bruit impulsionnel sans adoucir les contours, contrairement au flou.",
           en:"Median of a 3 × 3 neighbourhood, per channel. Non-linear: removes impulse noise without softening edges, unlike a blur." },
    run:(src) => opMedian(src) },

  { id:"nettete", g:"filtrage", fr:"Netteté", en:"Sharpen", k:[0,-1,0, -1,5,-1, 0,-1,0],
    run:(src) => conv3Color(src, [0,-1,0, -1,5,-1, 0,-1,0], 1) },

  { id:"sobelx", g:"contours", fr:"Sobel X", en:"Sobel X", k:SOBEL_X,
    run:(src, lum) => grayToImage(conv3(lum, SOBEL_X, 1, 128)) },

  { id:"sobely", g:"contours", fr:"Sobel Y", en:"Sobel Y", k:SOBEL_Y,
    run:(src, lum) => grayToImage(conv3(lum, SOBEL_Y, 1, 128)) },

  { id:"gradient", g:"contours", fr:"Gradient", en:"Gradient", k:SOBEL_X,
    note:{ fr:"‖∇I‖ = √(Gx² + Gy²) — noyau Gx ci-dessus, Gy est sa transposée.",
           en:"‖∇I‖ = √(Gx² + Gy²) — Gx shown above, Gy is its transpose." },
    run:(src, lum) => grayToImage(gradientMag(lum).mag) },

  { id:"laplacien", g:"contours", fr:"Laplacien", en:"Laplacian", k:[0,1,0, 1,-4,1, 0,1,0],
    note:{ fr:"Dérivée seconde : les contours ressortent aux passages par zéro.",
           en:"Second derivative: edges appear at the zero crossings." },
    run:(src, lum) => grayToImage(conv3(lum, [0,1,0, 1,-4,1, 0,1,0], 1, 128)) },

  { id:"canny", g:"contours", fr:"Canny", en:"Canny",
    note:{ fr:"Chaîne complète : lissage gaussien, gradient de Sobel, suppression des non-maxima le long de la direction du gradient, double seuil au 92ᵉ centile et hystérésis.",
           en:"Full chain: Gaussian smoothing, Sobel gradient, non-maximum suppression along the gradient direction, double threshold at the 92nd percentile, and hysteresis." },
    run:(src, lum) => grayToImage(opCanny(lum)) },

  { id:"otsu", g:"regions", fr:"Seuillage d'Otsu", en:"Otsu threshold",
    note:{ fr:"Seuil calculé à partir du seul histogramme, en maximisant la variance interclasse. Aucun réglage manuel.",
           en:"Threshold derived from the histogram alone, by maximising between-class variance. No manual tuning." },
    run:(src, lum) => grayToImage(binarize(lum, otsuThreshold(lum))) },

  { id:"erosion", g:"regions", fr:"Érosion", en:"Erosion",
    note:{ fr:"Morphologie mathématique sur l'image binarisée par Otsu : minimum sur un élément structurant 3 × 3. Les objets maigrissent, le bruit blanc disparaît.",
           en:"Mathematical morphology on the Otsu-binarised image: minimum over a 3 × 3 structuring element. Objects shrink and white speckle vanishes." },
    run:(src, lum) => grayToImage(morph(binarize(lum, otsuThreshold(lum)), false)) },

  { id:"dilatation", g:"regions", fr:"Dilatation", en:"Dilation",
    note:{ fr:"Maximum sur un élément structurant 3 × 3 : les objets grossissent et les trous se referment.",
           en:"Maximum over a 3 × 3 structuring element: objects grow and holes close up." },
    run:(src, lum) => grayToImage(morph(binarize(lum, otsuThreshold(lum)), true)) },

  { id:"egalisation", g:"couleur", fr:"Égalisation", en:"Equalisation",
    note:{ fr:"Égalisation d'histogramme : la fonction de répartition cumulée des luminances devient la courbe de transfert. Étale le contraste d'une image sous-exposée.",
           en:"Histogram equalisation: the cumulative distribution of luminance becomes the transfer curve. Spreads the contrast of an underexposed image." },
    run:(src, lum) => opEqualize(src, lum) },

  { id:"quantification", g:"couleur", fr:"Quantification", en:"Quantisation",
    note:{ fr:"k-moyennes sur les couleurs, k = 6 : l'image entière est ramenée à six teintes apprises sur ses propres pixels.",
           en:"k-means over colours, k = 6: the whole image is reduced to six tones learned from its own pixels." },
    run:(src) => opQuantize(src, 6) },

  { id:"spectre", g:"freq", fr:"Spectre FFT", en:"FFT spectrum", full:true,
    note:{ fr:"Transformée de Fourier 2D, 512 × 512, centrée : log(1 + |F(u,v)|). Le centre porte les basses fréquences, la périphérie les détails et les contours.",
           en:"2D Fourier transform, 512 × 512, centred: log(1 + |F(u,v)|). Low frequencies sit at the centre, detail and edges at the periphery." },
    run:(src, lum) => grayToImage(opSpectrum(lum)) },

  { id:"harris", g:"vision", fr:"Coins de Harris", en:"Harris corners",
    note:{ fr:"R = det(M) − k·trace(M)², M étant la matrice d'autocorrélation des gradients lissée. Les 180 meilleurs coins sont retenus, espacés d'au moins 14 px — ce sont eux que l'on apparie entre deux vues pour reconstruire en 3D.",
           en:"R = det(M) − k·trace(M)², with M the smoothed gradient autocorrelation matrix. The top 180 corners are kept, at least 14 px apart — these are the points matched across two views for 3D reconstruction." },
    run:(src, lum) => opHarris(src, lum) }
];

/* ---------- rendu ---------- */
function drawSplit(){
  if(!heroReady) return;
  const x = Math.round(W * (Number($("#split").value) / 100));
  ctx.putImageData(heroOriginal, 0, 0);
  if(x < W) ctx.putImageData(heroFiltered, 0, 0, x, 0, W - x, H);
  if(x > 0 && x < W){
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.fillRect(x - 1, 0, 2, H);
  }
}

function renderInfo(op, ms){
  const box = $("#kernel-info");
  box.innerHTML = "";
  if(op.k){
    const m = el("div", "kernel-matrix");
    op.k.forEach((v, i) => m.append(el("span", i === 4 ? "c" : null,
      op.div ? v + "/" + op.div : String(v))));
    box.append(m);
  }
  if(op.note) box.append(el("p", "kernel-note", op.note[lang]));
  if(ms != null){
    box.append(el("p", "kernel-time",
      (lang === "fr" ? "Calculé en " : "Computed in ") + ms + " ms — " + W + " × " + H + " px"));
  }
}

function applyOp(id){
  heroOp = id;
  const op = OPS.find(o => o.id === id) || OPS[0];
  $("#conv-name").textContent = op[lang];
  $$("#kernel-row button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === id)));
  if(!heroReady){ renderInfo(op, null); return; }
  let ms = heroCache[id + "_ms"];
  if(!heroCache[id]){
    const t0 = performance.now();
    heroCache[id] = op.run(heroOriginal, heroLum);
    ms = heroCache[id + "_ms"] = Math.round(performance.now() - t0);
  }
  heroFiltered = heroCache[id];
  renderInfo(op, ms);
  // le spectre de Fourier n'a pas de correspondance pixel a pixel avec la photo :
  // on ouvre la vue en grand, puis on rend sa position au visiteur ensuite.
  setSplit(op.full ? 0 : userSplit, false);
}

function buildOpRow(){
  const row = $("#kernel-row");
  row.innerHTML = "";
  let current = null;
  OPS.forEach(op => {
    if(op.g !== current){
      current = op.g;
      row.append(el("span", "op-group", GROUPS[current][lang]));
    }
    const b = el("button", null, op[lang]);
    b.type = "button";
    b.dataset.k = op.id;
    b.setAttribute("aria-pressed", String(op.id === heroOp));
    b.addEventListener("click", () => applyOp(op.id));
    row.append(b);
  });
}

let userSplit = 48;                  // position choisie par le visiteur
function setSplit(pct, remember = true){
  $("#split").value = pct;
  $("#split-out").innerHTML = pct + "&nbsp;%";
  if(remember) userSplit = pct;
  drawSplit();
}
$("#split").addEventListener("input", e => setSplit(Number(e.target.value)));

(function dragSplit(){
  let down = false;
  const fromX = clientX => {
    const r = canvas.getBoundingClientRect();
    setSplit(Math.round(Math.min(1, Math.max(0, (clientX - r.left) / r.width)) * 100));
  };
  canvas.addEventListener("pointerdown", e => {
    down = true; canvas.setPointerCapture(e.pointerId); fromX(e.clientX);
  });
  canvas.addEventListener("pointermove", e => { if(down) fromX(e.clientX); });
  canvas.addEventListener("pointerup", () => { down = false; });
  canvas.addEventListener("pointercancel", () => { down = false; });
})();

function loadHero(){
  const im = new Image();
  im.onload = () => {
    ctx.drawImage(im, 0, 0, W, H);
    heroOriginal = ctx.getImageData(0, 0, W, H);
    heroLum = luminance(heroOriginal);
    heroReady = true;
    applyOp(heroOp);
  };
  im.src = HERO_SRC;
}

/* ---------- scroll spy ---------- */
function spy(){
  const links = $$("#rail-list a");
  if(!links.length) return;
  let active = links[0].dataset.target;
  const y = window.scrollY + 140;
  NAV_IDS.forEach(([id])=>{
    const s = document.getElementById(id);
    if(s && s.offsetTop <= y) active = id;
  });
  links.forEach(a=>a.setAttribute("aria-current", String(a.dataset.target===active)));
}
window.addEventListener("scroll", ()=>{ window.requestAnimationFrame(spy); }, {passive:true});

/* ---------- boot ---------- */
(function boot(){
  let savedLang = null, savedTheme = null;
  try{ savedLang = localStorage.getItem("pf-lang"); savedTheme = localStorage.getItem("pf-theme"); }catch(e){}
  if(savedTheme){ document.documentElement.setAttribute("data-theme", savedTheme); }
  $("#theme-label").textContent = currentTheme()==="dark" ? "DARK" : "LIGHT";
  $("#theme-toggle").setAttribute("aria-pressed", String(currentTheme()==="light"));
  setLang(savedLang === "en" ? "en" : "fr");
  loadHero();
  spy();
})();
</script>
